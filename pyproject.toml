[build-system]
requires = [
    "setuptools==84.0.0",
    "setuptools_scm==10.2.1",
]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "xbuild"
description = "A PEP517 build frontend for cross-compiling wheels."
readme = "README.md"
requires-python = ">= 3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name="Russell Keith-Magee", email="russell@keith-magee.com"},
]
maintainers = [
    {name="Russell Keith-Magee", email="russell@keith-magee.com"},
]
keywords = [
    "pep517",
    "build",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Software Distribution",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "build == 1.6.0",
]

[project.scripts]
xbuild = "xbuild.__main__:entrypoint"
xvenv = "xvenv.__main__:entrypoint"

[project.urls]
Project = "https://github.com/beeware/xbuild"
Funding = "https://beeware.org/contributing/membership/"
Tracker = "https://github.com/beeware/xbuild/issues"
Source = "https://github.com/beeware/xbuild"

[dependency-groups]
# Extras used by developers *of* briefcase are pinned to specific versions to
# ensure environment consistency.
pre-commit = [
    "pre-commit == 4.6.2",
]
towncrier = [
    "towncrier==25.8.0",
]
tox = [
    "tox-uv == 1.35.2",
]
test = [
    "pytest == 9.1.1",
]
dev = [
    {include-group = "pre-commit"},
    {include-group = "test"},
    {include-group = "tox"},
]

# Docs are always built on a specific Python version; see RTD and tox config files.
# beeware-docs-tools is not published to PyPI; install from the base repo.
docs = [
    "beeware-docs-tools @ git+https://github.com/beeware/beeware-docs-tools@main",
]

[tool.check-wheel-contents]
toplevel = [
    "xbuild",
    "xvenv",
]

[tool.ruff.lint]
# In addition to the default rules, these additional rules will be used:
extend-select = [
    "E",      # pycodestyle
    "W",      # pycodestyle
    "F",      # pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "YTT",    # flake8-2020
    "ASYNC",  # flake8-async
    "C4",     # flake8-comprehensions
    "I",      # isort
    # The SIM rules are *very* opinionated, and don't necessarily make for better code.
    # They may be worth occasionally turning on just to see if something could actually
    # use improvement.
    # "SIM",    # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = [
    "xbuild",
    "xvenv",
]
known-third-party = [
    "build",
]

[tool.rumdl]
flavor = "mkdocs"
include = ["**/*.md"]
exclude = ["docs/en/SUMMARY.md", "CODE_OF_CONDUCT.md", "changes/template.md"]
respect-gitignore = true

# Disable rules:
# MD014: Force commands in codeblocks to show output
disable = ["MD014"]

[tool.rumdl.per-file-ignores]
# MD041: First line in file should be level 1 heading; title will be included in the target page
"docs/en/how-to/contribute/**/*.md" = ["MD041"]
"docs/en/how-to/contribute/*.md" = ["MD041"]
# MD041: Change note fragments are prose snippets, not standalone documents
"changes/*.md" = ["MD041"]

[tool.rumdl.MD013]  # Line length
line_length = 999999  # Force reflow to paragraph content to remove linebreaks
reflow = true
reflow_mode = "normalize"

[tool.rumdl.MD026]  # Remove punctuation at the end of headings
punctuation = ",;:"

[tool.rumdl.MD033]  # No inline HTML
allowed_elements = ["nospell",]  # pyspelling inline disable tag

[tool.rumdl.MD061]
terms = ["TODO"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# An empty table is needed to enable setuptools_scm

[tool.towncrier]
directory = "changes"
package = "xbuild"
package_dir = "src"
filename = "docs/en/about/releases.md"
title_format = false
template = "changes/template.md"
start_string = "<!-- towncrier release notes start -->"
type = [
    { directory = "feature", name = "Features", showcontent = true },
    { directory = "bugfix", name = "Bugfixes", showcontent = true },
    { directory = "removal", name = "Backward Incompatible Changes", showcontent = true },
    { directory = "doc", name = "Documentation", showcontent = true },
    { directory = "misc", name = "Misc", showcontent = false },
]
